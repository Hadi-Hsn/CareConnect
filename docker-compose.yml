version: '3.9'

services:
  # ChromaDB vector database for RAG embeddings
  chromadb:
    image: chromadb/chroma:latest
    container_name: careconnect-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careconnect-backend
    ports:
      - "8000:8000"
    environment:
      # SQLite database (no credentials needed, stored in volume)
      DATABASE_URL: sqlite+aiosqlite:///./data/careconnect.db
      
      # ChromaDB configuration
      VECTOR_STORE_TYPE: chromadb
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION_NAME: careconnect_docs
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4o
      OPENAI_EMBEDDING_MODEL: text-embedding-3-large
      OPENAI_EMBEDDING_DIMENSIONS: "3072"
      
      # Auth
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      JWT_ISSUER: careconnect
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "1440"
      
      # App settings
      FRONTEND_ORIGIN: http://localhost:5173
      LOG_LEVEL: INFO
      ENVIRONMENT: development
      RATE_LIMIT_PER_MINUTE: "60"
      ENABLE_PROMETHEUS: "true"
      ENABLE_PRIVACY_MODE: "false"
      MOCK_SCHEDULING: "true"
      
      # Email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
    volumes:
      - sqlite_data:/app/data
      - pdf_data:/data/doctor_pdfs
    depends_on:
      chromadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careconnect-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: ${FRONTEND_ORIGIN:-http://localhost:8000}/api/v1
      VITE_APP_NAME: CareConnect
      VITE_ENABLE_ANALYTICS: "false"
    depends_on:
      - backend

volumes:
  chroma_data:
  sqlite_data:
  pdf_data:
