version: '3.9'

services:
  # ChromaDB vector database for RAG embeddings
  chromadb:
    image: chromadb/chroma:latest
    container_name: careconnect-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careconnect-backend
    ports:
      - "8000:8000"
    environment:
      # SQLite database (no credentials needed, stored in volume)
      DATABASE_URL: sqlite+aiosqlite:///./data/careconnect.db
      
      # ChromaDB configuration
      VECTOR_STORE_TYPE: chromadb
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION_NAME: careconnect_docs
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-3072}
      
      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: careconnect
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "1440"
      
      # App settings
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://46.62.253.61:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: production
      RATE_LIMIT_PER_MINUTE: "60"
      ENABLE_PROMETHEUS: "true"
      ENABLE_PRIVACY_MODE: "false"
      MOCK_SCHEDULING: "true"
      
      # Email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CareConnect}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    volumes:
      - sqlite_data:/app/data
      - pdf_data:/data/doctor_pdfs
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE_URL:-http://46.62.253.61:8000/api/v1}
    container_name: careconnect-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE: ${VITE_API_BASE_URL:-http://46.62.253.61:8000/api/v1}
      VITE_APP_NAME: CareConnect
      VITE_ENABLE_ANALYTICS: "false"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  sqlite_data:
  pdf_data:
