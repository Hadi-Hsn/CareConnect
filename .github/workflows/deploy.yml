name: Deploy to Hetzner

on:
  push:
    branches:
      - prod
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r backend deploy/
          cp -r frontend deploy/
          cp docker-compose.prod.yml deploy/
          cp nginx-server.conf deploy/
          cp setup-nginx.sh deploy/
          cp .dockerignore deploy/ 2>/dev/null || true
          cat > deploy/deploy.sh << 'DEPLOYEOF'
          #!/bin/bash
          set -e
          echo "=== Starting Deployment ==="
          df -h
          
          # Setup Nginx if not already configured
          if [ ! -f /etc/nginx/sites-available/carecon.online ]; then
            echo "Setting up Nginx..."
            chmod +x setup-nginx.sh
            ./setup-nginx.sh || echo "Nginx setup failed, continuing..."
          fi
          
          docker system prune -af --volumes 2>/dev/null || true
          docker compose -f docker-compose.prod.yml down 2>/dev/null || true
          docker compose -f docker-compose.prod.yml up -d --build
          sleep 20
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=30
          curl -f http://localhost:8000/health || echo "Health check failed"
          
          # Create admin account
          echo "=== Creating Admin Account ==="
          docker exec careconnect-backend python scripts/create_admin.py || echo "Admin creation failed"
          
          df -h
          echo "=== Deployment Complete ==="
          DEPLOYEOF
          chmod +x deploy/deploy.sh
          tar -czf deployment.tar.gz -C deploy .

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "deployment.tar.gz"
          target: "/app/careconnect/"

      - name: Extract and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /app/careconnect
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            cat > .env << ENVEOF
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=gpt-4o
            OPENAI_EMBEDDING_MODEL=text-embedding-3-large
            OPENAI_EMBEDDING_DIMENSIONS=3072
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION_MINUTES=1440
            FRONTEND_ORIGIN=https://carecon.online
            VITE_API_BASE_URL=https://carecon.online/api/v1
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_FROM_NAME=CareConnect
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            LOG_LEVEL=INFO
            ENVIRONMENT=production
            ENVEOF
            chmod +x deploy.sh
            ./deploy.sh
