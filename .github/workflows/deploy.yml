name: Deploy to Hetzner

on:
  push:
    branches:
      - prod
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r backend deploy/
          cp -r frontend deploy/
          cp docker-compose.prod.yml deploy/
          cp nginx-server.conf deploy/
          cp setup-nginx.sh deploy/
          cp .dockerignore deploy/ 2>/dev/null || true
          cat > deploy/deploy.sh << 'DEPLOYEOF'
          #!/bin/bash
          set -e
          echo "=== Starting Deployment ==="
          df -h

          # Setup Nginx if not already configured
          if [ ! -f /etc/nginx/sites-available/carecon.online ]; then
            echo "Setting up Nginx..."
            chmod +x setup-nginx.sh
            ./setup-nginx.sh || echo "Nginx setup failed, continuing..."
          fi

          docker system prune -af --volumes 2>/dev/null || true
          docker compose -f docker-compose.prod.yml down 2>/dev/null || true
          docker compose -f docker-compose.prod.yml up -d --build

          # Wait for services to be ready
          echo "=== Waiting for services to start ==="
          sleep 30

          # Check backend health
          for i in {1..10}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting for backend... attempt $i/10"
            sleep 3
          done

          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs backend --tail=50

          # Create admin account
          echo ""
          echo "=== Creating Admin Account ==="
          if docker exec careconnect-backend python /app/scripts/create_admin.py; then
            echo "✓ Admin account ready: admin@admin.com / password123"
          else
            echo "✗ Admin creation failed - check logs above"
            docker compose -f docker-compose.prod.yml logs backend --tail=100
          fi

          df -h
          echo "=== Deployment Complete ==="
          DEPLOYEOF
          chmod +x deploy/deploy.sh
          tar -czf deployment.tar.gz -C deploy .

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "deployment.tar.gz"
          target: "/app/careconnect/"

      - name: Extract and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /app/careconnect
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            cat > .env << ENVEOF
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=gpt-4o
            OPENAI_EMBEDDING_MODEL=text-embedding-3-large
            OPENAI_EMBEDDING_DIMENSIONS=3072
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION_MINUTES=1440
            FRONTEND_ORIGIN=http://carecon.online
            VITE_API_BASE_URL=/api/v1
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_FROM_NAME=CareConnect
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            LOG_LEVEL=INFO
            ENVIRONMENT=production
            ENVEOF
            chmod +x deploy.sh
            ./deploy.sh
