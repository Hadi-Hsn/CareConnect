name: Deploy to Hetzner

on:
  push:
    branches:
      - prod
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r backend deploy/
          cp -r frontend deploy/
          cp docker-compose.yml deploy/docker-compose.yml
          cat > deploy/deploy.sh << 'DEPLOYEOF'
          #!/bin/bash
          set -e
          echo "=== Starting Deployment ==="
          df -h
          docker system prune -af --volumes 2>/dev/null || true
          docker compose down 2>/dev/null || true
          docker compose up -d --build
          sleep 20
          docker image prune -f
          docker compose ps
          docker compose logs --tail=30
          curl -f http://localhost:8000/health || echo "Health check failed"
          df -h
          echo "=== Deployment Complete ==="
          DEPLOYEOF
          chmod +x deploy/deploy.sh
          tar -czf deployment.tar.gz -C deploy .

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          source: "deployment.tar.gz"
          target: "/app/careconnect/"

      - name: Extract and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          script: |
            cd /app/careconnect
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            cat > .env << ENVEOF
            POSTGRES_USER=careconnect
            POSTGRES_PASSWORD=careconnect_prod_2025
            POSTGRES_DB=careconnect
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=gpt-4o
            OPENAI_EMBEDDING_MODEL=text-embedding-3-large
            OPENAI_EMBEDDING_DIMENSIONS=3072
            JWT_SECRET=8f7d6c5b4a3e2d1c0b9a8f7e6d5c4b3a2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5
            JWT_EXPIRATION_MINUTES=1440
            FRONTEND_ORIGIN=http://46.62.253.61:5173
            VITE_API_BASE_URL=http://46.62.253.61:8000/api/v1
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_FROM_NAME=CareConnect
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            LOG_LEVEL=INFO
            ENVIRONMENT=production
            ENVEOF
            chmod +x deploy.sh
            ./deploy.sh
